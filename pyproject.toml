[project]
name = "askmystuff"
version = "0.0.0"
description = "Ask your devices' manuals, and measure whether RAG still beats the whole manual in the prompt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pyright",
    "pytest",
    "pyyaml>=6.0.4",
    "ruff",
    "types-pyyaml>=6.0.12.20261122",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askmystuff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools", "src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["--strict-markers"]
